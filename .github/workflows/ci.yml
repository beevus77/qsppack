name: CI

on:
  push:
    branches: [main, refactor]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run test suite with enforced branch coverage
        run: python -m pytest --cov-fail-under=90

  wheel:
    name: Build and install wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Build wheel
        run: |
          python -m pip install build
          python -m build
      - name: Install wheel outside the checkout
        run: |
          python -m venv /tmp/qsppack-wheel-smoke
          /tmp/qsppack-wheel-smoke/bin/python -m pip install dist/qsppack-*.whl
          cd /tmp
          /tmp/qsppack-wheel-smoke/bin/python -c "import qsppack; assert callable(qsppack.solve)"

  docs:
    name: Strict documentation build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install documentation dependencies
        run: python -m pip install ".[docs]"
      - name: Execute notebooks and build documentation
        env:
          MPLBACKEND: Agg
        run: >-
          python -m sphinx -E -a -W --keep-going
          -D nbsphinx_execute=always
          -D nbsphinx_allow_errors=0
          -b html docs/source docs/_build/html
